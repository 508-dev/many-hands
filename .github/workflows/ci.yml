name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: PocketBase rules smoke test
        run: |
          if [ -f apps/pocketbase/scripts/smoke.sh ]; then
            apps/pocketbase/scripts/smoke.sh
          else
            echo "::notice::PocketBase smoke test is not present yet; skipping."
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Build production image
        run: docker build .

  ci-passed:
    if: always()
    needs:
      - web
      - smoke
      - docker
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit
      - name: Check required jobs
        env:
          WEB_RESULT: ${{ needs.web.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        run: |
          for result in "$WEB_RESULT" "$SMOKE_RESULT" "$DOCKER_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "A required CI job did not pass: web=$WEB_RESULT, smoke=$SMOKE_RESULT, docker=$DOCKER_RESULT" >&2
              exit 1
            fi
          done
